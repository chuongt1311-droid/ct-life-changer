# memory-api/docker-compose.yml
services:
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD} --appendonly yes
    volumes:
      - falkordb-data:/data
    # Bound to the VPS's loopback only — never a public port. Other
    # containers reach it over the compose network; CT reaches it for a
    # graphify import through an SSH tunnel (see DEPLOY.md), which lands
    # on the VPS host's own localhost:6379. Dropping the `127.0.0.1:`
    # prefix would publish it to the world.
    ports:
      - '127.0.0.1:6379:6379'

  memory-api:
    build: .
    restart: unless-stopped
    depends_on:
      - falkordb
    environment:
      - MEMORY_API_TOKEN=${MEMORY_API_TOKEN}
      - MEMORY_API_PORT=3001
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD}
    expose:
      - '3001'

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - memory-api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data

volumes:
  falkordb-data:
  caddy-data:
